name: Deploy to home.pl FTP

on:
  push:
    branches:
      - main # Upewnij się, że to nazwa Twojej głównej gałęzi (main lub master)

jobs:
  web-deploy:
    name: Wdrażanie plików
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Pobieranie kodu
      uses: actions/checkout@v4
    
    - name: ⚙️ Konfiguracja środowiska Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 📦 Instalacja zależności
      working-directory: ./astro
      run: npm install

    - name: 🏗️ Kompilacja projektu Astro
      working-directory: ./astro
      run: npm run build

    - name: 📂 Synchronizacja plików przez FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        protocol: ftps
        security: loose
        server-dir: /
        local-dir: ./astro/dist/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/README.md